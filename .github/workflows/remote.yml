# Checks the remote desktop set-up scripts (remote/host.ps1 for the owner's laptop, remote/client.ps1 for another
# laptop) on a real Windows machine: a RustDesk server here (the same official OSS hbbs/hbbr the family server runs),
# a stand-in for the family server's API that fills the scripts in as appweb does and hears the laptop's ID, then each
# script run by the very line the owner pastes into PowerShell (this runner already has administrator rights, so
# host.ps1 goes on without Windows' question). Publishes nothing.
name: remote

on:
  push:
    paths: ["remote/**", ".github/workflows/remote.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-${{ github.ref }}
  cancel-in-progress: true

env:
  # rustdesk-server 1.1.16 for Windows (the release names it "-unsigned"); its SHA-256, pinned
  RDS_URL: https://github.com/rustdesk/rustdesk-server/releases/download/1.1.16/rustdesk-server-windows-x86_64-unsigned.zip
  RDS_SHA256: b865a3a62fc8755b45480c508f1c4871c3338590408dda8c58c7e9c373b7adb0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The scripts parse in Windows PowerShell 5.1, carry only the server's placeholders (each in '…'), and nothing that makes Windows log their text
        run: |
          $ErrorActionPreference = 'Stop'
          $parse = Join-Path $env:RUNNER_TEMP 'parse.ps1'
          Set-Content -Path $parse -Encoding ascii -Value @'
          # parsed as irm | iex gets them: text decoded as UTF-8 (ParseFile would read a file without a BOM as ANSI)
          $bad = 0
          # Windows PowerShell's own check: a script block with one of its "suspicious" words goes whole into the event
          # log (4104) even with script block logging off, and the scripts must keep nothing there (internal: via reflection)
          $check = [System.Management.Automation.ScriptBlock].GetMethod('CheckSuspiciousContent', [System.Reflection.BindingFlags]'NonPublic, Static')
          if (-not $check) { $bad++; Write-Host "::error::Windows PowerShell's own check of the words it always logs was not found" }
          foreach ($f in $args) {
              $tokens = $null; $errs = $null
              $text = [IO.File]::ReadAllText($f, (New-Object System.Text.UTF8Encoding $false, $true))
              $ast = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errs)
              foreach ($e in $errs) { $bad++; Write-Host ("::error file={0},line={1}::{2}" -f $f, $e.Extent.StartLineNumber, $e.Message) }
              $hit = if ($check) { [string]$check.Invoke($null, @($ast)) } else { '' }
              if ($hit) {
                  $bad++
                  Write-Host ("::error file={0}::Windows PowerShell would write this script's whole text to its event log whatever the policy (it has: {1})" -f $f, $hit.Substring(0, [Math]::Min(80, $hit.Length)))
              }
              Write-Host ("{0}: {1} tokens, {2} errors (Windows PowerShell {3})" -f $f, $tokens.Count, $errs.Count, $PSVersionTable.PSVersion)
          }
          exit $bad
          '@
          & "$env:windir\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $parse `
            (Resolve-Path remote/host.ps1).Path (Resolve-Path remote/client.ps1).Path
          if ($LASTEXITCODE) { throw "the scripts do not parse in Windows PowerShell 5.1" }
          # no PASSWORD: the scripts ask /api/remote/pw for it at run time, so it is never in a script's text
          $want = @{ 'host.ps1' = 'API HOST KEY TOKEN'; 'client.ps1' = 'API HOST ID KEY TOKEN' }
          $check = [System.Management.Automation.ScriptBlock].GetMethod('CheckSuspiciousContent', [System.Reflection.BindingFlags]'NonPublic, Static')
          if (-not $check) { throw "PowerShell 7's own check of the words it always logs was not found" }
          foreach ($name in $want.Keys) {
              $text = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE "remote/$name"), [Text.UTF8Encoding]::new($false, $true))
              $hit = [string]$check.Invoke($null, @([System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$null)))
              if ($hit) { throw "$name`: PowerShell 7 would write its whole text to the event log (it has: $($hit.Substring(0, [Math]::Min(80, $hit.Length))))" }
              $all = [regex]::Matches($text, '\{\{([A-Z]+)\}\}') | ForEach-Object { $_.Groups[1].Value }
              $found = ($all | Sort-Object -Unique) -join ' '
              if ($found -ne $want[$name]) { throw "$name has placeholders [$found], expected [$($want[$name])]" }
              $bare = [regex]::Matches($text, "(?<!')\{\{[A-Z]+\}\}|\{\{[A-Z]+\}\}(?!')").Count
              if ($bare) { throw "$name has a placeholder outside '…'" }
              Write-Host "$name placeholders: $found"
          }

      - name: A laptop to be reached and another one that connects, against a RustDesk server here
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          function Check([bool]$Ok, [string]$What) {
              if ($Ok) { Write-Host "ok: $What" } else { Write-Host "::error::$What"; throw "check failed: $What" }
          }
          function Read-Toml([string]$Path, [string]$Table) {
              # one table of a RustDesk .toml file ("" = the top), as a hashtable
              $h = @{}; $in = -not $Table
              foreach ($line in [IO.File]::ReadAllLines($Path)) {
                  $t = $line.Trim()
                  if ($t -match '^\[') { $in = $t -match ('^\[\s*' + [regex]::Escape($Table) + '\s*\]$'); continue }
                  if ($in -and $t -match '^"?([A-Za-z0-9_-]+)"?\s*=\s*(.*)$') {
                      $k = $Matches[1]; $v = $Matches[2].Trim()
                      if ($v -match "^'(.*)'$" -or $v -match '^"(.*)"$') { $v = $Matches[1] }
                      $h[$k] = $v
                  }
              }
              return $h
          }
          function Test-Tcp([int]$Port) {
              $c = [Net.Sockets.TcpClient]::new()
              try { return $c.ConnectAsync('127.0.0.1', $Port).Wait(3000) } catch { return $false } finally { $c.Dispose() }
          }
          function Run-Line([string]$Line, [string]$Log) {
              # the owner's one line, pasted into Windows PowerShell; its exit code, its output kept in $Log (the first
              # line only lets this log show Russian: the owner's window has a console of its own)
              $file = Join-Path $out ([IO.Path]::GetFileNameWithoutExtension($Log) + '-line.ps1')
              $text = "try { [Console]::OutputEncoding = [Text.Encoding]::UTF8 } catch { }`r`n" + $Line + "`r`nexit `$LASTEXITCODE"
              Set-Content -Path $file -Encoding ascii -Value $text
              $o = & "$env:windir\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File $file 2>&1
              $code = $LASTEXITCODE
              $text = ($o | Out-String)
              [IO.File]::WriteAllText($Log, $text)
              Write-Host "----- $(Split-Path -Leaf $Log) (exit $code)"; Write-Host $text
              Check (-not $text.Contains($password)) "$(Split-Path -Leaf $Log): the password is not shown"
              return $code
          }

          # values as the family server makes them
          $abc = [char[]]'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'
          $password = -join (1..24 | ForEach-Object { $abc[[Security.Cryptography.RandomNumberGenerator]::GetInt32($abc.Length)] })
          Write-Host "::add-mask::$password"
          $token = -join (1..32 | ForEach-Object { '{0:x}' -f [Security.Cryptography.RandomNumberGenerator]::GetInt32(16) })
          $api = 'http://127.0.0.1:8099'

          # 1. the RustDesk server: hbbs makes its key first, hbbr then uses the same one
          $zip = Join-Path $env:RUNNER_TEMP 'rds.zip'
          curl.exe -sSfL --retry 3 -o $zip $env:RDS_URL
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "rustdesk-server zip sha256: $sha"
          Check ($sha -eq $env:RDS_SHA256) 'the RustDesk server is the pinned 1.1.16'
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'rds')
          $bin = Join-Path $env:RUNNER_TEMP 'rds\x86_64'
          $env:DB_URL = Join-Path $bin 'db_v2.sqlite3'
          Start-Process -FilePath (Join-Path $bin 'hbbs.exe') -WorkingDirectory $bin `
            -RedirectStandardOutput (Join-Path $out 'hbbs.log') -RedirectStandardError (Join-Path $out 'hbbs-err.log') | Out-Null
          $pub = Join-Path $bin 'id_ed25519.pub'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $pub); $i++) { Start-Sleep -Seconds 1 }
          Check (Test-Path $pub) 'hbbs made its key'
          Start-Process -FilePath (Join-Path $bin 'hbbr.exe') -ArgumentList '-k', '_' -WorkingDirectory $bin `
            -RedirectStandardOutput (Join-Path $out 'hbbr.log') -RedirectStandardError (Join-Path $out 'hbbr-err.log') | Out-Null
          $key = (Get-Content $pub -Raw).Trim()
          Check ($key -match '^[A-Za-z0-9+=]{40,64}$') "the server's key has no '/' (it goes into a file name): $key"
          Start-Sleep -Seconds 2
          foreach ($port in 21116, 21117) { Check (Test-Tcp $port) "the RustDesk server listens on $port" }

          # 2. the stand-in for the family server's API
          @{ API = $api; TOKEN = $token; HOST = '127.0.0.1'; KEY = $key; PASSWORD = $password } |
            ConvertTo-Json | Set-Content -Path (Join-Path $out 'values.json') -Encoding utf8
          $mock = Join-Path $env:RUNNER_TEMP 'mock_api.py'
          Set-Content -Path $mock -Encoding utf8 -Value @'
          # A stand-in for the family server's API (appweb): fills remote/*.ps1 in the way appweb does (never with the
          # password), serves them as text/plain; charset=utf-8, gives the password to /api/remote/pw, and keeps what
          # the laptop says to /api/remote/hello.
          import http.server, json, os, re, sys, urllib.parse

          REPO, OUT, PORT = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with open(os.path.join(OUT, "values.json"), encoding="utf-8-sig") as f:
              V = json.load(f)
          HELLO = os.path.join(OUT, "hello.json")
          # what could end or break PowerShell's '...' (typographic single quotes count too), as appweb refuses
          UNSAFE = re.compile("[" + "".join(map(chr, (39, 0x2018, 0x2019, 0x201A, 0x201B, 0x85, 0x2028, 0x2029))) + r"\x00-\x1f\x7f]")
          LAPTOP_ID = re.compile(r"[0-9a-zA-Z_-]{6,16}")


          def said():
              try:
                  with open(HELLO, encoding="utf-8") as f:
                      return json.load(f)
              except (OSError, ValueError):
                  return {"id": "", "count": 0}


          def fill(name):
              with open(os.path.join(REPO, "remote", name + ".ps1"), encoding="utf-8-sig") as f:
                  text = f.read()
              values = {k: v for k, v in V.items() if k != "PASSWORD"}
              values["ID"] = said()["id"]
              if any(not isinstance(v, str) or UNSAFE.search(v) for v in values.values()):
                  return None
              text = re.sub(r"\{\{([A-Z]+)\}\}", lambda m: values.get(m.group(1), m.group(0)), text)
              return None if re.search(r"\{\{[A-Z]+\}\}", text) else text


          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args):  # no token in the log
                  sys.stderr.write("%s %s\n" % (self.command, urllib.parse.urlsplit(self.path).path))
                  sys.stderr.flush()

              def answer(self, code, text, kind="text/plain; charset=utf-8"):
                  body = text.encode("utf-8")
                  self.send_response(code)
                  self.send_header("Content-Type", kind)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  url = urllib.parse.urlsplit(self.path)
                  m = re.fullmatch(r"/api/remote/(host\.ps1|client\.ps1|pw)", url.path)
                  if not m:
                      return self.answer(404, "no such page")
                  if urllib.parse.parse_qs(url.query).get("t", [""])[0] != V["TOKEN"]:
                      return self.answer(403, "Эта команда устарела или неверна.")
                  if m.group(1) == "pw":
                      return self.answer(200, V["PASSWORD"])
                  text = fill(m.group(1)[:-4])
                  if text is None:
                      return self.answer(503, "the template did not fill in")
                  self.answer(200, text)

              def do_POST(self):
                  if self.path != "/api/remote/hello":
                      return self.answer(404, "no such page")
                  raw = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                  try:
                      body = json.loads(raw or b"{}")
                  except ValueError:
                      return self.answer(400, "not JSON")
                  if body.get("t") != V["TOKEN"]:
                      return self.answer(403, "Эта команда устарела или неверна.")
                  if not LAPTOP_ID.fullmatch(str(body.get("id") or "")):
                      return self.answer(400, "bad id")
                  # read before writing ("w" empties the file at once), and a whole file put in place in one go
                  count = said()["count"] + 1
                  with open(HELLO + ".tmp", "w", encoding="utf-8") as f:
                      json.dump({"id": body["id"], "count": count}, f)
                  os.replace(HELLO + ".tmp", HELLO)
                  self.answer(200, json.dumps({"ok": True, "id": body["id"]}), "application/json")


          http.server.ThreadingHTTPServer(("127.0.0.1", PORT), Handler).serve_forever()
          '@
          Start-Process -FilePath python -ArgumentList $mock, $env:GITHUB_WORKSPACE, $out, '8099' `
            -RedirectStandardOutput (Join-Path $out 'api-out.log') -RedirectStandardError (Join-Path $out 'api.log') | Out-Null
          for ($i = 0; $i -lt 20 -and -not (Test-Tcp 8099); $i++) { Start-Sleep -Seconds 1 }
          Check (Test-Tcp 8099) 'the stand-in API listens'
          # every script block's text into Windows PowerShell's event log, as a work laptop's policy may have it (the
          # end checks that the password is in none of it); PowerShell 7 here reads a key of its own, so only the
          # scripts' Windows PowerShell is logged
          $sbl = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'
          New-Item -Path $sbl -Force | Out-Null
          New-ItemProperty -Path $sbl -Name EnableScriptBlockLogging -Value 1 -PropertyType DWord -Force | Out-Null
          # the owner's lines, exactly as the family server words them
          $line = { param($name) "powershell -NoProfile -ExecutionPolicy Bypass -Command `"[Net.ServicePointManager]::SecurityProtocol='Tls12'; irm '$api/api/remote/$name.ps1?t=$token' | iex`"" }
          $lnkName = 'Ноутбук (удалённо).lnk'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) $lnkName

          # 3. another laptop before the owner's one is set up: it says to set that one up first, and makes nothing
          $code = Run-Line (& $line 'client') (Join-Path $out 'client-early.log')
          Check ($code -ne 0) 'client.ps1 without the laptop''s ID stops'
          Check (-not (Test-Path $lnk)) 'client.ps1 without the ID makes no shortcut'

          # 4. the owner's laptop
          $code = Run-Line (& $line 'host') (Join-Path $out 'host-1.log')
          Check ($code -eq 0) 'host.ps1 finished well'
          $svc = Get-Service -Name RustDesk
          Check ($svc.Status -eq 'Running') 'the RustDesk service runs'
          Check ($svc.StartType -eq 'Automatic') 'the RustDesk service starts with Windows'
          $cfgDir = Join-Path $env:windir 'ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config'
          $opts = Read-Toml (Join-Path $cfgDir 'RustDesk2.toml') 'options'
          $want = [ordered]@{
              'custom-rendezvous-server' = '127.0.0.1'; 'relay-server' = '127.0.0.1:21117'; 'key' = $key
              'approve-mode' = 'password'; 'verification-method' = 'use-permanent-password'
              'enable-lan-discovery' = 'N'; 'direct-server' = 'N'; 'allow-remote-config-modification' = 'N'
              'enable-tunnel' = 'N'; 'enable-terminal' = 'N'; 'enable-camera' = 'N'; 'enable-remote-printer' = 'N'
              'allow-auto-disconnect' = 'Y'; 'auto-disconnect-timeout' = '30'; 'allow-remove-wallpaper' = 'Y'
          }
          foreach ($k in $want.Keys) { Check ($opts[$k] -ceq $want[$k]) "the service's settings: $k = $($want[$k]) (has '$($opts[$k])')" }
          Check (-not $opts['stop-service']) 'the service is not told to stop'
          $top = Read-Toml (Join-Path $cfgDir 'RustDesk.toml') ''
          Check ([bool]$top['password']) 'the service holds a permanent password'
          $hello = Get-Content (Join-Path $out 'hello.json') -Raw | ConvertFrom-Json
          Check ($hello.id -match '^[0-9a-zA-Z_-]{6,16}$') "the API heard the laptop's ID: $($hello.id)"
          $exe = ((Get-CimInstance Win32_Service -Filter "Name='RustDesk'").PathName -replace '^\s*"([^"]+)".*$', '$1')
          $rdId = (& $exe --get-id | Out-String).Trim()
          Check ($rdId -eq $hello.id) "it is the ID RustDesk has ($rdId)"
          $seen = ''
          for ($i = 0; $i -lt 30 -and $seen -ne $hello.id; $i++) {
              $seen = (& python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1], timeout=5); print(','.join(r[0] for r in c.execute('select id from peer')))" $env:DB_URL 2>$null) -split ',' |
                Where-Object { $_ -eq $hello.id } | Select-Object -First 1
              if ($seen -ne $hello.id) { Start-Sleep -Seconds 2 }
          }
          Check ($seen -eq $hello.id) 'the laptop signed up with our RustDesk server under that ID'
          $sleep = powercfg /q SCHEME_CURRENT SUB_SLEEP STANDBYIDLE | Out-String
          $lid = powercfg /q SCHEME_CURRENT SUB_BUTTONS LIDACTION | Out-String
          foreach ($p in @(@('sleep on mains power', $sleep), @('lid on mains power', $lid))) {
              if ($p[1] -match 'AC Power Setting Index:\s*0x0+\s') { Write-Host "ok: $($p[0]): never / nothing" }
              else { Write-Host "::warning::$($p[0]) is not set to never/nothing on this machine:`n$($p[1])" }
          }

          # 5. again: nothing to install, the same ID told once more
          $before = (Get-Item $exe).LastWriteTimeUtc
          $code = Run-Line (& $line 'host') (Join-Path $out 'host-2.log')
          Check ($code -eq 0) 'host.ps1 run again finished well'
          Check ((Get-Item $exe).LastWriteTimeUtc -eq $before) 'run again, it did not install RustDesk again'
          $hello2 = Get-Content (Join-Path $out 'hello.json') -Raw | ConvertFrom-Json
          Check ($hello2.id -eq $hello.id -and $hello2.count -eq $hello.count + 1) 'run again, it told the same ID once more'

          # 6. another laptop: its own settings file already there, with something of the user's to keep
          $defaults = Join-Path $env:APPDATA 'RustDesk\config\RustDesk_default.toml'
          New-Item -ItemType Directory -Force -Path (Split-Path $defaults) | Out-Null
          [IO.File]::WriteAllText($defaults, "[options]`nview_style = 'adaptive'`nimage_quality = 'best'`n")
          $code = Run-Line (& $line 'client') (Join-Path $out 'client.log')
          Check ($code -eq 0) 'client.ps1 finished well'
          $portable = Join-Path $env:LOCALAPPDATA "FamilyRemote\rustdesk-host=127.0.0.1,key=$key,.exe"
          Check (Test-Path -LiteralPath $portable) "the portable RustDesk is named for our server and key: $(Split-Path -Leaf $portable)"
          Check ((Get-FileHash -LiteralPath $portable -Algorithm SHA256).Hash -eq '8555777215510D83D2D61C9DC984E4FCC838BD7E79F9D18A42585431F5E8BB47') 'it is the official 1.5.0'
          Check (Test-Path -LiteralPath $lnk) "the desktop shortcut is there: $lnkName"
          # read back under a plain name: the shortcut maker passes its path through the old code page (1252 here),
          # where the Russian name is «???» and nothing is found
          $chk = Join-Path $env:RUNNER_TEMP 'check.lnk'
          Copy-Item -LiteralPath $lnk -Destination $chk -Force
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($chk)
          Check ($sc.TargetPath -eq $portable) "the shortcut opens that RustDesk ($($sc.TargetPath))"
          Check ($sc.Arguments -eq "--connect $($hello.id)") "the shortcut connects to the laptop ($($sc.Arguments))"
          $d = Read-Toml $defaults 'options'
          foreach ($kv in @(@('image_quality', 'low'), @('custom-fps', '15'), @('show_quality_monitor', 'Y'), @('view_style', 'adaptive'))) {
              Check ($d[$kv[0]] -eq $kv[1]) "defaults for new connections: $($kv[0]) = $($kv[1])"
          }
          # the clipboard as Windows PowerShell sees it: the password, with the mark that keeps it out of the clipboard
          # history (Win+V) and its sync. The password reaches the check through its environment, not its text
          $clipCheck = Join-Path $out 'clip-check.ps1'
          Set-Content -Path $clipCheck -Encoding ascii -Value @'
          [void][Reflection.Assembly]::Load('System.Windows.Forms, Version=4.0.0.0, Culture=neutral, PublicKeyToken=b77a5c561934e089')
          $d = [System.Windows.Forms.Clipboard]::GetDataObject()
          if (-not $d) { 'nothing'; exit }
          $text = [string]$d.GetData([System.Windows.Forms.DataFormats]::UnicodeText)
          $same = if ($text.Trim() -ceq $env:RD_TEST_PW) { 'same' } elseif ($text) { 'other' } else { 'empty' }
          $mark = if ($d.GetDataPresent('ExcludeClipboardContentFromMonitorProcessing')) { 'marked' } else { 'unmarked' }
          "$same $mark"
          '@
          $env:RD_TEST_PW = $password
          $clip = (& "$env:windir\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File $clipCheck 2>&1 | Out-String).Trim()
          Remove-Item Env:RD_TEST_PW
          Check ([IO.File]::ReadAllText((Join-Path $out 'client.log')).Contains('Пароль в буфере')) 'client.ps1 put the password on the clipboard'
          Check ($clip -eq 'same marked') "the password is on the clipboard, kept out of the clipboard history ($clip)"

          # 7. again: nothing to fetch, still one shortcut to the same laptop
          $before = (Get-Item -LiteralPath $portable).LastWriteTimeUtc
          $code = Run-Line (& $line 'client') (Join-Path $out 'client-2.log')
          Check ($code -eq 0) 'client.ps1 run again finished well'
          Check ((Get-Item -LiteralPath $portable).LastWriteTimeUtc -eq $before) 'run again, it did not fetch RustDesk again'

          # 8. a real connection: the portable RustDesk started as the shortcut starts it (plus the password, for this
          # test only) takes our server and key from its own file name, hbbs lets it through with that key, and the
          # laptop's service lets it in with the permanent password. Only a login brings the laptop's own details
          # (its name, Windows) back: the portable keeps them in its notes on that peer
          # The portable runs here as the Windows user whose own RustDesk settings host.ps1's command lines filled in
          # (rustdesk.exe --config/--option keep a copy for the user), and RustDesk takes the server and key from there
          # when its file name says nothing; on the real other laptop there is no such copy. So it is set aside first,
          # and must still name no server or key afterwards
          $userToml = Join-Path $env:APPDATA 'RustDesk\config\RustDesk2.toml'
          if (Test-Path -LiteralPath $userToml) { Move-Item -LiteralPath $userToml -Destination (Join-Path $env:RUNNER_TEMP 'user-RustDesk2.toml') -Force }
          function Test-UserNoServer {
              if (-not (Test-Path -LiteralPath $userToml)) { return $true }
              $o = Read-Toml $userToml 'options'
              return -not ($o['custom-rendezvous-server'] -or $o['relay-server'] -or $o['key'])
          }
          Check (Test-UserNoServer) "this Windows user's own RustDesk settings name no server or key"
          $peer = Join-Path $env:APPDATA "RustDesk\config\peers\$($hello.id).toml"
          Remove-Item -LiteralPath $peer -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath $portable -ArgumentList '--connect', $hello.id, '--password', $password -WorkingDirectory (Split-Path $portable) | Out-Null
          $info = @{}
          for ($i = 0; $i -lt 60 -and -not $info['platform']; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path -LiteralPath $peer) { try { $info = Read-Toml $peer 'info' } catch { $info = @{} } }
          }
          Write-Host "the portable's notes on the laptop: platform '$($info['platform'])', hostname '$($info['hostname'])'"
          $hbbs = (Get-Content (Join-Path $out 'hbbs.log') -Raw -ErrorAction SilentlyContinue) + (Get-Content (Join-Path $out 'hbbs-err.log') -Raw -ErrorAction SilentlyContinue)
          Check (-not ($hbbs -match 'invalid key')) 'hbbs took the key the portable has from its file name'
          Check ($info['platform'] -eq 'Windows' -and $info['hostname']) 'the portable RustDesk logged in to the laptop with the permanent password'
          # the controlling side closed again (the laptop's service stays)
          Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'rustdesk*' -and $_.ExecutablePath -and
              -not $_.ExecutablePath.StartsWith($env:ProgramFiles, [StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Check (Test-UserNoServer) '…and still none after it: the server and key came from the file name alone'

          # 9. the line host.ps1 hands to Windows when it has no administrator rights (Start-Elevated): built by host.ps1's
          # own Get-RelaunchArguments and run by Windows PowerShell 5.1 the way Windows runs it, minus the question (this
          # runner is an administrator already); Enter for its «Нажмите Enter» at the end
          $hostText = (Invoke-WebRequest -UseBasicParsing -Uri "$api/api/remote/host.ps1?t=$token").Content
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($hostText, [ref]$null, [ref]$null)
          $fn = $ast.Find({ param($a) $a -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $a.Name -eq 'Get-RelaunchArguments' }, $true)
          Check ([bool]$fn) 'host.ps1 has Get-RelaunchArguments'
          . ([scriptblock]::Create($fn.Extent.Text))
          $stale = [regex]::Match($hostText, "\`$stale = '([^']+)'").Groups[1].Value
          Check ($stale -match 'устарела') 'host.ps1 has its line for an old command'
          function Run-Relaunch([string]$Arguments, [string]$Log) {
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
              $psi.Arguments = $Arguments
              $psi.UseShellExecute = $false
              $psi.RedirectStandardInput = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.StandardOutputEncoding = [Text.Encoding]::UTF8
              $psi.StandardErrorEncoding = [Text.Encoding]::UTF8
              $p = [Diagnostics.Process]::Start($psi)
              $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
              $p.StandardInput.WriteLine(''); $p.StandardInput.Close()
              if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "$(Split-Path -Leaf $Log): the window did not close in 15 minutes" }
              $text = $o.Result + $e.Result
              [IO.File]::WriteAllText($Log, $text)
              Write-Host "----- $(Split-Path -Leaf $Log) (exit $($p.ExitCode))"; Write-Host $text
              Check (-not $text.Contains($password)) "$(Split-Path -Leaf $Log): the password is not shown"
              return @{ Code = $p.ExitCode; Text = $text }
          }
          # the line asks for RemoteSigned: a new Windows' policy is Restricted, which does not load the script module
          # Windows PowerShell's Get-FileHash lives in (what Restricted does is shown, not required)
          $probe = "Get-FileHash -LiteralPath `$env:windir\System32\notepad.exe | Out-Null; 'hashed'"
          $ps51 = Join-Path $env:windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $r1 = (& $ps51 -NoProfile -ExecutionPolicy Restricted -Command $probe 2>&1 | Out-String)
          $r2 = (& $ps51 -NoProfile -ExecutionPolicy RemoteSigned -Command $probe 2>&1 | Out-String)
          if ($r1 -match 'hashed') { Write-Host '::warning::Get-FileHash loaded under Restricted here too' } else { Write-Host 'ok: under Restricted, Get-FileHash does not load' }
          Check ($r2 -match 'hashed') 'under RemoteSigned (the relaunch line''s) it does'
          Check ((Get-RelaunchArguments $stale) -like '-NoProfile -ExecutionPolicy RemoteSigned -Command *') 'the relaunch line asks for RemoteSigned'
          $count = (Get-Content (Join-Path $out 'hello.json') -Raw | ConvertFrom-Json).count
          $r = Run-Relaunch (Get-RelaunchArguments $stale) (Join-Path $out 'host-elevated.log')
          Check ($r.Code -eq 0 -and $r.Text.Contains('Готово!')) 'the relaunched window set the laptop up'
          Check ((Get-Content (Join-Path $out 'hello.json') -Raw | ConvertFrom-Json).count -eq $count + 1) 'the relaunched window told the ID'
          # an old command: the window says so in its own line (the one with «» and Cyrillic in it) and waits for Enter.
          # (Get-RelaunchArguments reads $Token, which is $token: PowerShell's names know no case)
          $good = $token; $token = '0' * 32
          $r = Run-Relaunch (Get-RelaunchArguments $stale) (Join-Path $out 'host-elevated-stale.log')
          $token = $good
          Check ($r.Code -eq 0 -and $r.Text -notmatch 'ParserError|Exception|Готово') 'the relaunched window with an old command stops there, and waits for Enter'
          if ($r.Text.Contains($stale)) { Write-Host 'ok: …saying the command is old, in its own words' }
          else { Write-Host '::warning::the old-command line did not come through as UTF-8 here (the line itself ran: see above)' }

          # 10. another laptop whose profile folder has a Russian name, on a Windows whose old code page has no Cyrillic
          # (this one's): the shortcut maker may turn the folder into «???», so client.ps1 reads the shortcut back and,
          # when it is not right, leaves a starter file that names the folder through %LOCALAPPDATA% instead
          $cyr = Join-Path $env:RUNNER_TEMP 'Профиль\AppData\Local'
          $cyrExe = Join-Path $cyr "FamilyRemote\rustdesk-host=127.0.0.1,key=$key,.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $cyrExe) | Out-Null
          Copy-Item -LiteralPath $portable -Destination $cyrExe -Force  # already there: nothing to fetch
          $starter = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Ноутбук (удалённо).cmd'
          Remove-Item -LiteralPath $lnk, $starter -Force -ErrorAction SilentlyContinue
          $keepLocal = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $cyr
          try { $code = Run-Line (& $line 'client') (Join-Path $out 'client-cyrillic.log') } finally { $env:LOCALAPPDATA = $keepLocal }
          Check ($code -eq 0) 'client.ps1 in a Russian-named profile finished well'
          if (Test-Path -LiteralPath $lnk) {
              Copy-Item -LiteralPath $lnk -Destination $chk -Force
              $t = (New-Object -ComObject WScript.Shell).CreateShortcut($chk).TargetPath
              Check ($t -eq $cyrExe) "…its shortcut opens that RustDesk ($t)"
              Check (-not (Test-Path -LiteralPath $starter)) '…and there is no starter file besides'
          } else {
              Check (Test-Path -LiteralPath $starter) '…no shortcut: a starter file instead'
              $txt = [IO.File]::ReadAllText($starter)
              $wantTxt = "@start `"`" `"%LOCALAPPDATA%\FamilyRemote\rustdesk-host=127.0.0.1,key=$key,.exe`" --connect $($hello.id)`r`n"
              Check ($txt -ceq $wantTxt) "…naming the folder through %LOCALAPPDATA%: $txt"
              Check ([IO.File]::ReadAllText((Join-Path $out 'client-cyrillic.log')).Contains('вместо него')) '…and it says so'
          }

          # 11. Windows PowerShell's event logs, with every script block's text in them (above): host.ps1's text is
          # there, the password nowhere (looked for in halves: a long text is logged in parts)
          $events = @(Get-WinEvent -LogName 'Microsoft-Windows-PowerShell/Operational' -ErrorAction SilentlyContinue) +
            @(Get-WinEvent -LogName 'Windows PowerShell' -ErrorAction SilentlyContinue)
          $blocks = @($events | Where-Object { $_.Id -eq 4104 })
          Check (@($blocks | Where-Object { "$($_.Message)".Contains('Get-RelaunchArguments') }).Count -gt 0) "the log holds host.ps1's text ($($blocks.Count) script blocks logged)"
          $halves = $password.Substring(0, 12), $password.Substring(12)
          $leaks = @($events | Where-Object { $m = "$($_.Message)"; $m.Contains($halves[0]) -or $m.Contains($halves[1]) })
          Check ($leaks.Count -eq 0) "no event in Windows PowerShell's logs holds the password ($($leaks.Count) of $($events.Count) do)"
          Write-Host 'All checks passed.'

      - name: Logs (the job's own log cannot be read from outside, so the ends go into the run's notes too)
        if: failure()
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'out'
          $files = @(Get-ChildItem $out -File -ErrorAction SilentlyContinue | Where-Object Name -ne 'values.json')  # (the password)
          $files += @(Get-ChildItem (Join-Path $env:TEMP 'FamilyRemote') -Filter *.log -File -ErrorAction SilentlyContinue)
          foreach ($dir in (Join-Path $env:windir 'ServiceProfiles\LocalService\AppData\Roaming\RustDesk\log'), (Join-Path $env:APPDATA 'RustDesk\log')) {
              $files += @(Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 6)
          }
          foreach ($f in $files) {
              Write-Host "::group::$($f.FullName)"
              Get-Content -LiteralPath $f.FullName -Tail 300 -ErrorAction SilentlyContinue
              Write-Host '::endgroup::'
              $tail = (Get-Content -LiteralPath $f.FullName -Tail 40 -ErrorAction SilentlyContinue) -join "`n"
              if ($tail.Trim() -and $f.Length -lt 50MB) {
                  $tail = $tail.Substring([Math]::Max(0, $tail.Length - 2500)).Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
                  Write-Host "::warning title=$($f.Name)::$tail"
              }
          }
