# Builds «Winger» for Windows: the app (Go, sing-box inside as a library), the bridge's program (vpn-app/bridge), tests it
# on a Windows machine against a real hysteria server (other programs' pages must go through the virtual interface, the
# installed service must be driven by its window's API) and its window in a browser; publishes winger.exe as a release:
# the family server hands it out and the installed ones update themselves from it.
name: win-app

on:
  push:
    paths: ["win-app/**", "vpn-app/bridge/**", ".github/workflows/win-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-app-${{ github.ref }}
  cancel-in-progress: true

env:
  HY_VERSION: app/v2.13.0
  TAGS: with_gvisor,with_quic,badlinkname,tfogo_checklinkname0

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: win-app/go.mod
          cache-dependency-path: win-app/go.sum
      - name: Unit tests and the window against a real hysteria server
        run: |
          set -e
          mkdir -p /tmp/out
          exec > >(tee -a /tmp/out/window.log) 2>&1
          cd win-app
          go test -tags "$TAGS" -ldflags=-checklinkname=0 ./...
          go build -tags "$TAGS" -ldflags "-checklinkname=0 -X main.versionName=1.0.ci" -o /tmp/winger .
          mkdir -p /tmp/t && cd /tmp/t
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 -subj '/CN=vpn.test.local' \
            -addext 'subjectAltName=DNS:vpn.test.local' -keyout key.pem -out cert.pem
          gh release download "$HY_VERSION" --repo apernet/hysteria --pattern hysteria-linux-amd64 --output hysteria && chmod +x hysteria
          printf 'listen: 127.0.0.1:4443\ntls:\n  cert: /tmp/t/cert.pem\n  key: /tmp/t/key.pem\nauth:\n  type: userpass\n  userpass:\n    family: "test-pass-123"\n' > hy.yaml
          HYSTERIA_LOG_LEVEL=debug nohup ./hysteria server -c hy.yaml > hy.log 2>&1 &
          cd "$GITHUB_WORKSPACE/win-app/ci"
          npm init -y >/dev/null && npm install --silent playwright@1.49.1 && npx playwright install --with-deps chromium >/dev/null
          LINK='hysteria2://family:test-pass-123@127.0.0.1:4443/?sni=vpn.test.local&insecure=1#%D0%A2%D0%B5%D1%81%D1%82'
          for theme in light dark; do  # each run with fresh data, as a new computer
            rm -rf /tmp/wd && mkdir -p /tmp/wd
            WINGER_DATA=/tmp/wd /tmp/winger --serve --no-tun > /tmp/out/serve-$theme.log 2>&1 &
            P=$!
            sleep 3
            DARK=$([ $theme = dark ] && echo 1) WDATA=/tmp/wd OUT=/tmp/out WLINK="$LINK" node ui_test.js
            kill $P; wait $P 2>/dev/null || true
          done
          # the window's own check went through the server (not straight past it)
          grep -qE 'reqAddr.*(cloudflare|gstatic)' /tmp/t/hy.log || { echo "::error::Winger's own check did not go through the server"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Logs as a release (the job's own log cannot be read from outside)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/t/hy.log /tmp/out/hysteria.log 2>/dev/null || true
          cp /tmp/wd/journal.log /tmp/out/journal.log 2>/dev/null || true
          find /tmp/out -type f -size 0 -delete
          gh release create "win-app-window-${{ github.run_number }}" /tmp/out/* --prerelease --target "$GITHUB_SHA" \
            --title "Winger для Windows: окно, проверка ${{ github.run_number }}" --notes "Логи проверки окна (не прошла)."

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: win-app/go.mod
          cache-dependency-path: |
            win-app/go.sum
            vpn-app/bridge/go.sum
      - id: v
        run: echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - name: Build (the bridge's program, the app with its icon)
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out"
          exec > >(tee -a "$GITHUB_WORKSPACE/out/build.log") 2>&1
          mkdir -p win-app/bin
          (cd vpn-app/bridge && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../win-app/bin/winger-relay.exe ./relay)
          cd win-app
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon winger.ico --manifest gui \
            --product-name "Winger VPN" --file-description "Winger VPN" --product-version "1.0.${{ steps.v.outputs.code }}"
          V="-X main.versionName=1.0.${{ steps.v.outputs.code }} -X main.versionCodeStr=${{ steps.v.outputs.code }}"
          CGO_ENABLED=0 go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0 -s -w $V -H windowsgui" -o winger.exe .
          CGO_ENABLED=0 go build -trimpath -tags "$TAGS" -ldflags "-checklinkname=0 -s -w $V" -o winger-console.exe .
          ls -la *.exe
      - name: Test on Windows
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd win-app
          gh release download "$HY_VERSION" --repo apernet/hysteria --pattern hysteria-windows-amd64.exe --output hysteria.exe
          OUT="$GITHUB_WORKSPACE/out" bash ci/windows_test.sh 2>&1 | tee "$GITHUB_WORKSPACE/out/windows.log"
          exit "${PIPESTATUS[0]}"
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::Publish: $BASH_COMMAND failed"' ERR
          CODE=${{ steps.v.outputs.code }}
          mkdir -p rel
          if [ -f win-app/winger.exe ]; then
            cp win-app/winger.exe rel/winger-$CODE.exe
            SHA=$(sha256sum rel/winger-$CODE.exe | cut -d' ' -f1)
            printf '{"code": %s, "name": "1.0.%s", "sha256": "%s", "commit": "%s"}\n' "$CODE" "$CODE" "$SHA" "$GITHUB_SHA" > rel/win-app-$CODE.json
          fi
          cp out/* rel/ 2>/dev/null || true
          find rel -type f -size 0 -delete
          STATE="${{ job.status }}"
          ls -la rel
          # gh's own words go into the run's summary: the job's log cannot be read from outside
          for try in 1 2; do
            if R=$(gh release create "win-app-$CODE" rel/* --prerelease --target "$GITHUB_SHA" \
                 --title "Winger для Windows 1.0.$CODE" --notes "Build $CODE (tests: $STATE)." 2>&1); then
              echo "$R"; exit 0
            fi
            echo "::warning::Publish, try $try: $(echo "$R" | tail -4 | tr '\n' ' ')"
            gh release delete "win-app-$CODE" --yes --cleanup-tag 2>/dev/null || true
            sleep 30
          done
          echo "::error::Publish: the release was not created (gh's words above)"; exit 1
