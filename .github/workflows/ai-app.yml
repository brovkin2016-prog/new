# Builds the ИИ-помощник Android app, tests it on an emulator against a local hysteria server (HTTP/3 over UDP,
# then TLS on TCP 8443 with UDP blocked) and publishes the unsigned APK as a release: the server signs it with
# its own key and offers it to the phones as an update.
name: ai-app

on:
  # push: код живёт в закрытом winger-src — запуск только командой (gh workflow run)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-app-${{ github.ref }}
  cancel-in-progress: true

env:
  # the VPN inside Winger: the same pinned Hysteria client and hev-socks5-tunnel as vpn-app.yml
  HY_VERSION: app/v2.13.0
  HY_SHA_ARM64: 13d5b85cd45e11cf02847dc2b6229d6f9a20b3cb87a00b9356cf244e3bd8db84
  HY_SHA_ARMV7: 41a4c3f1f03fac5da47af33902f34dce66a3b491a59c0879a057b5899037e604
  HY_SHA_AMD64: 093c3f7b2d8cb255bd62148e2662d9054e1bc6fb69ae57ece4665016dfcd1a03
  HEV_TAG: "2.18.0"
  HEV_COMMIT: d9dca26c7ad0e494492244f0309e80ee583e739e

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brovkin2016-prog/winger-src
          ref: claude/admiring-dijkstra-0dlqep
          token: ${{ secrets.SRC_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Versions
        id: v
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          CRONET=$(curl -fsSL https://dl.google.com/android/maven2/org/chromium/net/cronet-embedded/maven-metadata.xml \
                   | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          echo "cronet=${CRONET:-119.6045.31}" >> "$GITHUB_OUTPUT"
          echo "Cronet ${CRONET:-119.6045.31}"

      - name: Hysteria client and the tunnel (pinned, checked)
        run: |
          set -e
          J=ai-app/android/app/src/main/jniLibs
          get() {  # abi, release file, sha256
            mkdir -p "$J/$1"
            curl -fsSL -o "$J/$1/libhysteria.so" "https://github.com/apernet/hysteria/releases/download/$HY_VERSION/$2"
            echo "$3  $J/$1/libhysteria.so" | sha256sum -c -
          }
          get arm64-v8a hysteria-android-arm64 "$HY_SHA_ARM64"
          get armeabi-v7a hysteria-android-armv7 "$HY_SHA_ARMV7"
          get x86_64 hysteria-android-amd64 "$HY_SHA_AMD64"
          # the tunnel's native part, built by the app (app/build.gradle: externalNativeBuild ndkBuild hev/Android.mk)
          git clone -q --depth 1 --branch "$HEV_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/heiher/hev-socks5-tunnel ai-app/android/app/hev
          test "$(git -C ai-app/android/app/hev rev-parse HEAD)" = "$HEV_COMMIT"

      - name: Screens into the APK
        run: |
          mkdir -p ai-app/android/app/src/main/assets
          rm -rf ai-app/android/app/src/main/assets/www
          cp -r ai-app/www ai-app/android/app/src/main/assets/www
          python3 ai-app/ci/version.py ai-app/android/app/src/main/assets/www

      - name: Release APK (unsigned)
        working-directory: ai-app/android
        run: |
          gradle --no-daemon assembleRelease -PversionCode=${{ steps.v.outputs.code }} -PcronetVersion=${{ steps.v.outputs.cronet }}
          # phones with 16 KB memory pages (a later Android may refuse code that is not aligned to them)
          for f in winger server study photo store; do
            python3 ../../vpn-app/tools/elf_16k.py "app/build/outputs/apk/$f/release/app-$f-release-unsigned.apk"
          done

      - name: Test server (stand-in assistant behind a real hysteria)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/t && cd /tmp/t
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 2 -subj '/CN=AI Test CA' -keyout ca.key -out ca.pem
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -subj '/CN=vpn.test.local' -keyout key.pem -out req.csr
          printf 'subjectAltName=DNS:vpn.test.local\nbasicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n' > ext
          openssl x509 -req -in req.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -extfile ext -out cert.pem
          cat cert.pem ca.pem > chain.pem
          mkdir -p "$GITHUB_WORKSPACE/ai-app/android/app/src/debug/res/raw"
          cp ca.pem "$GITHUB_WORKSPACE/ai-app/android/app/src/debug/res/raw/test_ca.pem"
          gh release download --repo apernet/hysteria --pattern hysteria-linux-amd64 --output hysteria && chmod +x hysteria
          ./hysteria version | grep -i '^version' 
          cat > hy.yaml <<'EOT'
          listen: :443
          tls:
            cert: /tmp/t/chain.pem
            key: /tmp/t/key.pem
          auth:
            type: password
            password: not-the-app
          masquerade:
            type: proxy
            proxy:
              url: http://127.0.0.1:18790/
              rewriteHost: false
            listenHTTPS: :8443
          EOT
          nohup python3 "$GITHUB_WORKSPACE/ai-app/ci/stub_server.py" 18790 "$GITHUB_WORKSPACE/ai-app/android/app/src/main/assets/www" > stub.log 2>&1 &
          sudo nohup ./hysteria server -c hy.yaml > hy.log 2>&1 &
          # the VPN inside Winger (its own Hysteria 2 client): a login of its own on another port, and its journal in
          # debug — the emulator check reads in it whether the phone's traffic really went through the tunnel
          cat > hy-vpn.yaml <<'EOT'
          listen: :4443
          tls:
            cert: /tmp/t/chain.pem
            key: /tmp/t/key.pem
          auth:
            type: userpass
            userpass:
              family: "test-pass-123"
          EOT
          HYSTERIA_LOG_LEVEL=debug nohup ./hysteria server -c hy-vpn.yaml > hy-vpn.log 2>&1 &
          sleep 3
          grep -q "server up and running" hy-vpn.log
          curl -sk --resolve vpn.test.local:8443:127.0.0.1 https://vpn.test.local:8443/app/version.json && echo

      - name: Debug APK for the emulator
        working-directory: ai-app/android
        run: |
          # the profile the debug build is given for its VPN test hook (no payment in the test): the hysteria server above
          VPN_LINK="-PtestVpnLink=hysteria2://family:test-pass-123@10.0.2.2:4443/?sni=vpn.test.local&insecure=1"
          # first the next version (code + 1): the test updates the app over itself with it, as a real update does
          gradle --no-daemon assembleWingerDebug -PversionCode=$(( ${{ steps.v.outputs.code }} + 1 )) -PcronetVersion=${{ steps.v.outputs.cronet }} \
            -Pabis=x86_64 "-PtestHostRules=MAP vpn.test.local 10.0.2.2" -PtestLogin=vpn.test.local/TEST-CODE "$VPN_LINK"
          cp app/build/outputs/apk/winger/debug/app-winger-debug.apk /tmp/next-debug.apk
          gradle --no-daemon assembleWingerDebug -PversionCode=${{ steps.v.outputs.code }} -PcronetVersion=${{ steps.v.outputs.cronet }} \
            -Pabis=x86_64 "-PtestHostRules=MAP vpn.test.local 10.0.2.2" -PtestLogin=vpn.test.local/TEST-CODE "$VPN_LINK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: ${{ github.workspace }}/ai-app/android/app/build/outputs/apk/winger/debug/app-winger-debug.apk
          NEXT_APK: /tmp/next-debug.apk
          OUT: /tmp/out
          CA: /tmp/t/ca.pem
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -writable-system
          script: bash ai-app/ci/emulator_test.sh

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::Publish: $BASH_COMMAND failed"' ERR
          CODE=${{ steps.v.outputs.code }}
          mkdir -p /tmp/rel
          for pair in winger:ai-app server:winger-server study:winger-study photo:winger-photo store:winger-store; do
            f=${pair%%:*}; n=${pair##*:}
            APK=ai-app/android/app/build/outputs/apk/$f/release/app-$f-release-unsigned.apk
            [ -f "$APK" ] || { echo "::error::Publish: no release APK at $APK"; exit 1; }
            cp "$APK" /tmp/rel/$n-$CODE-unsigned.apk
            SHA=$(sha256sum /tmp/rel/$n-$CODE-unsigned.apk | cut -d' ' -f1)
            printf '{"code": %s, "name": "1.0.%s", "sha256": "%s", "cronet": "%s", "commit": "%s"}\n' \
              "$CODE" "$CODE" "$SHA" "${{ steps.v.outputs.cronet }}" "$GITHUB_SHA" > /tmp/rel/$n-$CODE.json
          done
          cp /tmp/out/*.png /tmp/out/*.log /tmp/rel/ 2>/dev/null || true
          cp /tmp/t/hy.log /tmp/rel/hysteria.log 2>/dev/null || true
          cp /tmp/t/hy-vpn.log /tmp/rel/hysteria-vpn.log 2>/dev/null || true
          cp /tmp/t/stub.log /tmp/rel/stub.log 2>/dev/null || true
          find /tmp/rel -type f -size 0 -delete  # an empty file cannot be a release asset
          STATE="${{ job.status }}"
          ls -la /tmp/rel
          # gh's own words go into the run's summary: the job's log cannot be read from outside
          for try in 1 2; do
            if R=$(gh release create "ai-app-$CODE" --repo "$GITHUB_REPOSITORY" /tmp/rel/* --prerelease --target "$GITHUB_SHA" \
                 --title "Winger 1.0.$CODE (все сборки)" --notes "Unsigned build $CODE (tests: $STATE). The server signs it with its own key." 2>&1); then
              echo "$R"; exit 0
            fi
            echo "::warning::Publish, try $try: $(echo "$R" | tail -4 | tr '\n' ' ')"
            gh release delete "ai-app-$CODE" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            sleep 30
          done
          echo "::error::Publish: the release was not created (gh's words above)"; exit 1
