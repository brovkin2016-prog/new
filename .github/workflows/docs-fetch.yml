name: docs-fetch
# Reads public documentation pages this repository's tools are built against (the build machines can reach sites the
# development sandbox cannot) and prints them into the job log. No secrets, nothing published.
on:
  push:
    paths: [".github/workflows/docs-fetch.yml", ".github/docs-fetch.txt"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          # a line: URL [regex] — markdown/text pages are printed as they are (HTML tags stripped only from web pages);
          # with a regex only the matching lines, two lines around each
          while read -r url re; do
            case "$url" in ""|\#*) continue ;; esac
            echo "=================== $url $re"
            curl -sSL -m 40 -A "Mozilla/5.0 docs-fetch" "$url" > page || true
            case "$url" in *.md|*.txt|*.yaml|*.yml|*.json) ;; *) sed -i -e 's/<[^>]*>//g' page ;; esac
            if [ -n "$re" ]; then grep -i -E -C2 -- "$re" page || true; else grep -v '^\s*$' page || true; fi | head -c 60000
            echo
          done < .github/docs-fetch.txt
