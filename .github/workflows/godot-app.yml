# «Пустошь» — приложение на Godot 4. Отдельная сборка: движок и проект берутся из закрытого
# winger-src, APK собирается экспортными шаблонами Godot и подписывается отладочным ключом
# (для телефона владельца). Публикуется как pre-release с APK внутри.
name: godot-app

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_DIR: 4.7.2.stable
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brovkin2016-prog/winger-src
          ref: claude/admiring-dijkstra-0dlqep
          token: ${{ secrets.SRC_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (preinstalled on the runner)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager)"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null
          ls "$SDK/build-tools/34.0.0" | head -5

      - name: Godot and export templates
        run: |
          set -e
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_VERSION}_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_DIR}"
          unzip -q "Godot_v${GODOT_VERSION}_export_templates.tpz" -d /tmp/tpl
          cp -r /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_DIR}/"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_DIR}/" | head

      - name: Debug keystore and editor settings
        run: |
          set -e
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 9999 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -deststoretype pkcs12 >/dev/null 2>&1
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project
        run: ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path pustosh --import

      - name: Export APK
        run: |
          set -e
          mkdir -p pustosh/build
          ./Godot_v${GODOT_VERSION}_linux.x86_64 --headless --path pustosh --export-debug "Android" build/pustosh.apk
          ls -la pustosh/build/
          python3 - <<'PY'
          import zipfile
          p = "pustosh/build/pustosh.apk"
          with zipfile.ZipFile(p) as z:
              print("entries", len(z.namelist()), "test", z.testzip())
          PY

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -f pustosh/build/pustosh.apk ]; then echo "::error::no APK"; exit 1; fi
          mkdir -p /tmp/rel
          cp pustosh/build/pustosh.apk /tmp/rel/pustosh.apk
          echo "${{ github.run_number }}" > /tmp/rel/build.txt
          gh release create "pustosh-${GITHUB_RUN_NUMBER}" --repo "$GITHUB_REPOSITORY" /tmp/rel/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Пустошь · сборка ${GITHUB_RUN_NUMBER}" \
            --notes "Тестовая сцена Godot: движение, камера, терминал. Отладочная подпись."
