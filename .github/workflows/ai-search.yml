name: ai-search

# The AI helper's internet search (ai-app/server/websearch.py): the pages' shapes and the guard against internal
# addresses offline, then the real search pages from a machine on the open internet, as the family server is.
on:
  # push: код живёт в закрытом winger-src — запуск только командой (gh workflow run)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: brovkin2016-prog/winger-src
          ref: claude/admiring-dijkstra-0dlqep
          token: ${{ secrets.SRC_TOKEN }}
      - name: Search and read pages, no key needed
        working-directory: ai-app/server
        run: python3 websearch_test.py --live
