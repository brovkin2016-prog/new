<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">  <!-- Edge and Chrome on a non-Russian Windows: no «Translate page?» over the window -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Winger</title>
<link rel="icon" href="logo.png">
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>

<body data-phase="off">
<!-- the sky (B «Северное сияние», the same as the phone's and the AI helper's): three curtains of light, rays in the middle
     one, stars at night; its colours follow the VPN (app.css: --a1 --a2 --a3) -->
<svg class="sky" viewBox="0 0 1280 320" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
 <defs>
  <linearGradient id="ag1" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a1)" stop-opacity="0"/><stop offset=".4" style="stop-color:var(--a1)" stop-opacity=".8"/><stop offset="1" style="stop-color:var(--a1)" stop-opacity="0"/></linearGradient>
  <linearGradient id="ag2" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a2)" stop-opacity="0"/><stop offset=".45" style="stop-color:var(--a2)" stop-opacity=".6"/><stop offset="1" style="stop-color:var(--a2)" stop-opacity="0"/></linearGradient>
  <linearGradient id="ag3" x2="0" y2="1"><stop offset="0" style="stop-color:var(--a3)" stop-opacity="0"/><stop offset=".5" style="stop-color:var(--a3)" stop-opacity=".55"/><stop offset="1" style="stop-color:var(--a3)" stop-opacity="0"/></linearGradient>
  <linearGradient id="fade" x2="0" y2="1"><stop offset=".3" stop-color="#fff"/><stop offset=".95" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="ab" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="ab2" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="ray" width="37" height="320" patternUnits="userSpaceOnUse"><rect width="2" height="320" fill="#fff"/><rect x="7" width="4" height="320" fill="#fff" opacity=".5"/><rect x="17" width="1.5" height="320" fill="#fff" opacity=".8"/><rect x="26" width="5" height="320" fill="#fff" opacity=".35"/></pattern>
  <mask id="am"><rect width="1280" height="320" fill="url(#ray)"/></mask>
  <mask id="fm"><rect width="1280" height="320" fill="url(#fade)"/></mask>
 </defs>
 <g mask="url(#fm)">
  <g class="lights" filter="url(#ab)">
   <path d="M-40 70C260 10 420 120 700 60S1100 0 1320 50L1320 150C1080 110 880 170 700 150S240 110-40 170Z" fill="url(#ag3)"/>
   <path d="M-40 140C180 60 360 180 600 110S1020 30 1320 110L1320 230C1060 170 860 250 600 220S180 190-40 260Z" fill="url(#ag1)"/>
   <path d="M200 120C420 80 600 150 820 100S1100 80 1320 130L1320 200C1100 170 900 220 760 190S420 170 200 200Z" fill="url(#ag2)"/>
  </g>
  <g class="rays" mask="url(#am)" filter="url(#ab2)"><path d="M-40 130C180 50 360 170 600 100S1020 20 1320 100L1320 210C1060 160 860 240 600 210S180 180-40 250Z" fill="url(#ag1)"/></g>
  <g class="stars" fill="#fff"><circle cx="90" cy="40" r="1.2"/><circle cx="310" cy="24" r="1"/><circle cx="760" cy="20" r="1"/><circle cx="980" cy="38" r="1.2"/><circle cx="1180" cy="22" r="1"/><circle cx="1240" cy="70" r="1.1"/><circle cx="40" cy="96" r="1"/></g>
 </g>
</svg>

<main id="app">
  <header class="top">
    <svg class="mark" aria-hidden="true"><use href="#logo"/></svg>
    <div><h1>Winger</h1><small id="sub">VPN от Бровкина Алексея</small></div>
  </header>
  <section class="hero">
    <button id="power" class="power" aria-label="Включить или выключить VPN"><svg class="i" aria-hidden="true"><use href="#i-power"/></svg></button>
    <div id="state" class="state">Выключено</div>
    <div class="facts"><span id="note" class="note"></span></div>
    <button id="ping" class="ping" hidden></button>
  </section>
  <button id="add" class="btn wide" hidden><svg class="i" aria-hidden="true"><use href="#i-paste"/></svg>Вставить ссылку</button>
  <h2 class="sec" id="connsHead" hidden>Подключение</h2>
  <div id="conns" class="list"></div>
  <div id="hint" class="hint"></div>
  <div id="prep" class="hint prep" hidden>Мосты для этого ноутбука готовятся на сервере — у него будут свои, не телефона. Появятся сами через несколько минут.</div>
  <h2 class="sec">Настройки</h2>
  <div class="list" id="settings">
    <button class="item" id="appsRow" hidden><span class="well"><svg class="i"><use href="#i-layers"/></svg></span><span class="t"><b>Какие приложения</b><small id="appsVal"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <button class="item" id="bridgeAppsRow" hidden><span class="well"><svg class="i"><use href="#i-phone"/></svg></span><span class="t"><b>Приложения через мост</b><small id="bridgeAppsVal"></small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <button class="item" id="addRow"><span class="well"><svg class="i"><use href="#i-plus"/></svg></span><span class="t"><b>Добавить подключение</b></span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <button class="item" id="ver"><span class="well"><svg class="i"><use href="#i-refresh"/></svg></span><span class="t"><b>Обновления</b><small id="verName">Winger</small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <button class="item" id="journal" hidden><span class="well"><svg class="i"><use href="#i-copy"/></svg></span><span class="t"><b>Скопировать журнал</b><small>И проверку связи — чтобы вставить в чат</small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
    <button class="item" id="rescue" hidden><span class="well"><svg class="i"><use href="#i-lifebuoy"/></svg></span><span class="t"><b>Спасение сервера</b><small>Консоль в браузере</small></span><svg class="i chev"><use href="#i-chev"/></svg></button>
  </div>
</main>
<!-- a connection's «⋯»: its speed, or removing it -->
<div id="menu" class="menu" role="menu" hidden>
  <button role="menuitem" data-act="speed"><svg class="i" aria-hidden="true"><use href="#i-speed"/></svg>Скорость</button>
  <button role="menuitem" data-act="remove" class="danger"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Удалить</button>
</div>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog"><div id="sheet-body"></div></div></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
