<!doctype html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">  <!-- Edge and Chrome on a non-Russian Windows: no «Translate page?» over the window -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winger</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app">
  <header>
    <img src="logo.png" alt="" class="logo">
    <div><h1>Winger</h1><small id="sub">VPN от Бровкина Алексея</small></div>
  </header>
  <section class="hero">
    <button id="power" class="power" aria-label="Включить или выключить VPN"><svg viewBox="0 0 24 24" width="54" height="54" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.6 6.6a7.6 7.6 0 1 0 10.8 0"/></svg></button>
    <div id="state" class="state">Выключено</div>
    <div class="facts"><span id="note" class="note"></span><button id="ping" class="ping" hidden></button></div>
  </section>
  <button id="add" class="btn wide" hidden>📋 Вставить ссылку</button>
  <h2 class="sec" id="connsHead" hidden>Подключение</h2>
  <div id="conns" class="list"></div>
  <div id="hint" class="hint"></div>
  <div id="prep" class="hint prep" hidden>🌉 Мосты для этого ноутбука готовятся на сервере — у него будут свои, не телефона. Появятся сами через несколько минут.</div>
  <h2 class="sec">Настройки</h2>
  <div class="list" id="settings">
    <button class="item" id="appsRow" hidden><span class="ic">🧩</span><span class="grow">Через сервер</span><span class="val" id="appsVal"></span><span class="chev">›</span></button>
    <button class="item" id="bridgeAppsRow" hidden><span class="ic">🌉</span><span class="grow">Через мост</span><span class="val" id="bridgeAppsVal"></span><span class="chev">›</span></button>
    <button class="item" id="addRow"><span class="ic">➕</span><span class="grow">Добавить подключение</span><span class="chev">›</span></button>
    <button class="item" id="ver"><span class="ic">🔄</span><span class="grow">Проверить обновление</span><span class="val" id="verName">Winger</span><span class="chev">›</span></button>
    <button class="item" id="journal"><span class="ic">📋</span><span class="grow">Скопировать журнал и проверку связи</span><span class="chev">›</span></button>
    <button class="item" id="rescue" hidden><span class="ic">🆘</span><span class="grow">Спасение сервера: консоль в браузере</span><span class="chev">›</span></button>
  </div>
</main>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog"><div id="sheet-body"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
