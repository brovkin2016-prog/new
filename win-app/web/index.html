<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winger</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="app">
  <header>
    <img src="icon.svg" alt="" class="logo">
    <div><h1>Winger</h1><small id="sub">VPN от Бровкина Алексея</small></div>
  </header>
  <section class="hero">
    <button id="power" class="power" aria-label="Включить или выключить VPN"><span>⏻</span></button>
    <div id="state" class="state">Выключено</div>
    <div id="note" class="note"></div>
    <button id="ping" class="ping" hidden></button>
  </section>
  <div id="conns"></div>
  <div id="prep" class="note prep" hidden>🌉 Мосты для этого ноутбука готовятся на сервере — у него будут свои, не телефона. Появятся сами через несколько минут.</div>
  <section class="card" id="appsCard" hidden>
    <h2>Какие программы через VPN</h2>
    <div class="seg" id="mode">
      <button data-only="0">Все программы</button>
      <button data-only="1">Только выбранные</button>
    </div>
    <div id="apps" class="apps"></div>
  </section>
  <button id="add" class="btn soft wide">📋 Вставить ссылку</button>
  <footer>
    <div class="verrow"><span id="verName">Winger</span><button id="ver" class="btn soft small">🔄 Проверить обновление</button></div>
    <button id="journal" class="link">📋 Скопировать журнал и проверку связи</button>
  </footer>
</main>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" role="dialog"><div id="sheet-body"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
